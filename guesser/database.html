<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Guesser — データベース</title>
  <meta name="description" content="原神キャラクター・武器データベース。詳細な項目で絞り込み可能。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
  <style>
    /* ---- Database extra styles ---- */
    .db-header { display:flex; align-items:center; gap:.6rem; margin-bottom:1rem; flex-wrap:wrap; }
    .db-tab { padding:.35rem .9rem; border:2px solid var(--border); border-radius:6px; background:transparent; color:#fff; font-family:inherit; font-size:.85rem; cursor:pointer; }
    .db-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    
    /* ---- 高機能マルチフィルター用のグリッドレイアウト ---- */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .filter-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .filter-item label { font-size: 0.72rem; color: var(--text-muted, #95a5a6); font-weight: 700; }
    .filter-select, .filter-input {
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      color: #000000;
      font-size: 0.8rem;
    }
    .filter-select option { background: #ffffff; color: #000000; }
    .filter-input:focus { border-color: var(--accent); outline: none; }
    .filter-btn-row { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 0.4rem; }
    .reset-btn { padding: .45rem 1rem; background: #7f8c8d; border: none; border-radius: 8px; color: #fff; font-family: inherit; font-size: .8rem; cursor: pointer; font-weight: bold; transition: background 0.15s; }
    .reset-btn:hover { background: #95a5a6; }

    /* ---- カード・グリッド表示 ---- */
    .db-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:.75rem; }
    .db-card { background:var(--bg-card); border:1.5px solid var(--border); border-radius:10px; padding:.7rem; text-align:left; cursor:pointer; transition:border-color .15s; font-size:.88rem; color:#fff; display:flex; flex-direction:column; gap:.55rem; }
    .db-card:hover, .db-card.active { border-color:var(--accent); }
    .db-card .card-thumb-wrap { aspect-ratio:1/1; border-radius:8px; background:rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .db-card .card-thumb { width:100%; height:100%; object-fit:cover; }
    .db-card .card-thumb-fallback { color:#fff; font-size:2rem; }
    .db-card .card-name { color:#fff; font-weight:700; line-height:1.4; }
    .rarity-5 { border-color:#e8a030; }
    .rarity-4 { border-color:#9966cc; }
    .rarity-3 { border-color:#4da3ff; }
    .rarity-2 { border-color:#3aaa5a; }
    .rarity-1 { border-color:#f5f7fb; }
    .empty-msg { text-align:center; color:#fff; padding:2rem; }
    
    /* ---- 詳細モーダル ---- */
    .db-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:300; }
    .db-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(94vw,760px); max-height:88vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); z-index:301; padding:1.2rem; color:#fff; }
    .db-modal-head { display:flex; align-items:center; gap:.8rem; margin-bottom:1rem; }
    .db-modal-title { font-size:1.1rem; color:#fff; font-weight:700; }
    .db-modal-close { margin-left:auto; background:transparent; border:1px solid var(--border); border-radius:8px; color:#fff; cursor:pointer; font-family:inherit; padding:.35rem .8rem; }
    .db-modal-body { display:grid; gap:1rem; }
    .db-modal-hero { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
    .db-modal-image-wrap { width:min(140px,100%); aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; }
    .db-modal-image { width:100%; height:100%; object-fit:cover; }
    .db-modal-fallback { font-size:3rem; color:#fff; }
    .db-modal-summary { display:grid; gap:.35rem; flex:1; }
    .db-detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.6rem 1rem; }
    .db-detail-item { font-size:.82rem; display:flex; flex-direction:column; gap:.2rem; }
    .db-detail-item b { color:var(--text-muted, #95a5a6); font-weight:700; font-size:.75rem; }
    .db-edit-input, .db-edit-select { padding:0.4rem 0.6rem; background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:#fff; font-family:inherit; font-size:0.85rem; width:100%; }
    .db-edit-input:focus, .db-edit-select:focus { border-color:var(--accent); outline:none; }
    .db-save-row { display:flex; justify-content:flex-end; margin-top:1rem; gap:.5rem; }
    .db-save-btn { padding:.5rem 1.2rem; background:var(--accent); border:none; border-radius:8px; color:#111; font-weight:bold; cursor:pointer; font-size:.9rem; }
    .db-save-btn:hover { opacity:.85; }

    /* 管理者認証モーダル */
    .admin-input { width: 100%; padding: 0.5rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-top: 0.3rem; margin-bottom: 0.8rem; font-family: inherit; font-size: 0.9rem; }
    .admin-auth-btn { width: 100%; padding: 0.6rem; background: var(--accent); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; }
    .admin-error { color: #f85149; font-size: 0.85rem; text-align: center; margin-top: 0.5rem; }
    .admin-label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 0.5rem; margin-bottom: 0.2rem; font-weight: bold; }
  </style>
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">📚 データベース</h1>
    <nav class="header-actions">
      <a href="../index.html" class="back-link icon-btn">← メニュー</a>
    </nav>
  </header>

  <main class="app-main" role="main">

    <!-- タブ切替 ＆ 隠し管理者トリガー（歯車アイコンを10回連続クリック） -->
    <div class="db-header">
      <button class="db-tab active" data-tab="character">👤 キャラクター</button>
      <button class="db-tab" data-tab="weapon">⚔ 武器</button>
      <button class="db-tab" id="dbAdminTrigger" type="button" aria-label="管理者メニュー" style="margin-left: auto; background: transparent; border-color: transparent; color: var(--text-muted); cursor: default;">⚙️</button>
    </div>

    <!-- キャラクターフィルタ -->
    <div id="charFilters">
      <div class="filter-grid">
        <div class="filter-item"><label for="char-name-input">名前</label><input id="char-name-input" class="filter-input" type="text" placeholder="名前検索"></div>
        <div class="filter-item"><label for="char-country">国</label><select id="char-country" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-weapon">武器種</label><select id="char-weapon" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-element">元素</label><select id="char-element" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-birthMonth">誕生月</label><select id="char-birthMonth" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-releaseVersion">実装Ver</label><select id="char-releaseVersion" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-rarity">レアリティ</label><select id="char-rarity" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-body">体型</label><select id="char-body" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-role">役割</label><select id="char-role" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-energy">エネルギー</label><select id="char-energy" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-talentBoss">ボス素材</label><select id="char-talentBoss" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-localSpecialty">特産品</label><select id="char-localSpecialty" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-enemyMaterial">敵素材</label><select id="char-enemyMaterial" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-ascensionStat">突破ステータス</label><select id="char-ascensionStat" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-talentBook">天賦本</label><select id="char-talentBook" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-talentWeekly">週ボス素材</label><select id="char-talentWeekly" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-specialDish">料理種別</label><select id="char-specialDish" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="char-distributed">配布</label><select id="char-distributed" class="filter-select"><option value="all">すべて</option><option value="true">あり</option><option value="false">なし</option></select></div>
        <div class="filter-item"><label for="char-trainingRoad">鍛錬の道</label><select id="char-trainingRoad" class="filter-select"><option value="all">すべて</option><option value="true">あり</option><option value="false">なし</option></select></div>
        <div class="filter-item"><label for="char-trace">軌跡</label><select id="char-trace" class="filter-select"><option value="all">すべて</option><option value="true">あり</option><option value="false">なし</option></select></div>
        <div class="filter-item"><label for="char-costume">別衣装</label><select id="char-costume" class="filter-select"><option value="all">すべて</option><option value="true">あり</option><option value="false">なし</option></select></div>
        <div class="filter-item"><label for="charQuery">キャラ名を検索</label><input id="charQuery" class="filter-input" type="text" placeholder="全項目を対象に検索"></div>
        <div class="filter-btn-row"><button id="char-reset-btn" class="reset-btn" type="button">フィルターをリセット</button></div>
      </div>
    </div>

    <!-- 武器フィルタ -->
    <div id="weaponFilters" style="display:none;">
      <div class="filter-grid">
        <div class="filter-item"><label for="w-name-input">名前</label><input id="w-name-input" class="filter-input" type="text" placeholder="名前検索"></div>
        <div class="filter-item"><label for="w-type">武器種</label><select id="w-type" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="w-rarity">レアリティ</label><select id="w-rarity" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="w-ascensionStat">突破ステータス</label><select id="w-ascensionStat" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="w-weaponBreakMaterial">武器突破素材</label><select id="w-weaponBreakMaterial" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="w-enemyMaterial">敵素材</label><select id="w-enemyMaterial" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="w-weaponEnemyMaterial">精鋭素材</label><select id="w-weaponEnemyMaterial" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="w-releaseVersion">実装Ver</label><select id="w-releaseVersion" class="filter-select"><option value="all">すべて</option></select></div>
        <div class="filter-item"><label for="w-distributed">配布武器</label><select id="w-distributed" class="filter-select"><option value="all">すべて</option><option value="true">あり</option><option value="false">なし</option></select></div>
        <div class="filter-item" style="grid-column: 1 / -1;"><label for="weaponQuery">全要素キーワード</label><input id="weaponQuery" class="filter-input" type="text" placeholder="全項目を対象に検索"></div>
        <div class="filter-btn-row"><button id="w-reset-btn" class="reset-btn" type="button">フィルターをリセット</button></div>
      </div>
    </div>

    <!-- グリッド表示 -->
    <div class="db-grid" id="dbGrid"></div>

  </main>

  <footer class="app-footer">
    <p><a href="../index.html">← メニューへ戻る</a></p>
  </footer>

  <!-- 詳細・編集モーダル -->
  <div class="db-modal-overlay hidden" id="detailOverlay" aria-hidden="true"></div>
  <section class="db-modal hidden" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="db-modal-head">
      <h2 class="db-modal-title" id="detailTitle">詳細情報</h2>
      <button class="db-modal-close" id="detailClose" type="button" aria-label="閉じる">閉じる</button>
    </div>
    <div class="db-modal-body">
      <div class="db-modal-hero">
        <div class="db-modal-image-wrap" id="detailImageWrap"></div>
        <div class="db-modal-summary" id="detailSummary"></div>
      </div>
      <form id="detailEditForm">
        <div class="db-detail-grid" id="detailGrid"></div>
        <div class="db-save-row" style="display:none;">
          <button type="submit" class="db-save-btn">GitHubへコミット（全ユーザーに反映）</button>
        </div>
      </form>
    </div>
  </section>

  <!-- 🔐 管理者認証モーダル -->
  <div class="db-modal-overlay hidden" id="adminAuthOverlay" aria-hidden="true"></div>
  <div class="db-modal hidden" id="adminAuthModal" role="dialog" aria-modal="true" aria-labelledby="adminAuthTitle">
    <div class="db-modal-head">
      <h2 class="db-modal-title" id="adminAuthTitle">🔐 管理者認証</h2>
      <button class="db-modal-close" id="adminAuthClose" type="button" aria-label="閉じる">✕</button>
    </div>
    <div class="db-modal-body">
      <label class="admin-label" for="adminPasswordInput">管理者パスワード</label>
      <input type="password" id="adminPasswordInput" placeholder="パスワードを入力" class="admin-input">
      
      <label class="admin-label" for="githubTokenInput">GitHub Personal Access Token (PAT)</label>
      <input type="password" id="githubTokenInput" placeholder="ghp_xxxxxxxxxxxx" class="admin-input">
      <p style="font-size:0.75rem; color:#aaa; margin-top:-0.4rem; margin-bottom:0.8rem;">※全ユーザーへの自動反映（GitHubコミット）に必要です（repo権限）</p>

      <button class="admin-auth-btn" id="adminAuthBtn" type="button">認証</button>
      <p class="admin-error hidden" id="adminAuthError">パスワードが違います</p>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    'use strict';
    let currentTab = 'character';
    let currentEditingItem = null;
    let isAdminMode = false;
    let githubToken = localStorage.getItem('github_pat') || '';

    const GITHUB_REPO_OWNER = 'rakiku';
    const GITHUB_REPO_NAME = 'Genshinguesser';
    const GITHUB_FILE_PATH = 'guesser/data.js';

    const activeFilters = { 
      charName: '', charCountry: 'all', charWeapon: 'all', charElement: 'all', charBirthMonth: 'all',
      charReleaseVersion: 'all', charRarity: 'all', charBody: 'all', charRole: 'all', charEnergy: 'all',
      charTalentBoss: 'all', charLocalSpecialty: 'all', charEnemyMaterial: 'all', charAscensionStat: 'all',
      charTalentBook: 'all', charTalentWeekly: 'all', charSpecialDish: 'all', charDistributed: 'all',
      charTrainingRoad: 'all', charTrace: 'all', charCostume: 'all', charQuery: '',
      wName: '', wType: 'all', wRarity: 'all', wAscensionStat: 'all', wWeaponBreakMaterial: 'all',
      wEnemyMaterial: 'all', wWeaponEnemyMaterial: 'all', wReleaseVersion: 'all', wDistributed: 'all', wQuery: ''
    };
    
    const QUERY_DEBOUNCE_MS = 120;
    let queryDebounceTimer = null;
    const jpSort = (list) => [...list].sort((a, b) => String(a).localeCompare(String(b), 'ja'));

    document.addEventListener('DOMContentLoaded', () => {
      bindTabs();
      initAdvancedFilters();
      bindAdvancedFilters();
      bindDetailModal();
      renderGrid();
      bindAdminAuthTrigger();
    });

    function bindTabs() {
      document.querySelectorAll('.db-tab[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTab = btn.dataset.tab;
          document.querySelectorAll('.db-tab[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
          document.getElementById('charFilters').style.display = currentTab === 'character' ? '' : 'none';
          document.getElementById('weaponFilters').style.display = currentTab === 'weapon' ? '' : 'none';
          renderGrid();
        });
      });
    }

    function initAdvancedFilters() {
      function parseReleaseVersionNum(str) {
        if (typeof parseReleaseVersion === 'function') return parseReleaseVersion(str);
        return parseFloat(str) || 0;
      }
      populateSelect('char-country', jpSort([...new Set(CHARACTERS.map(c => c.country))].filter(Boolean)));
      populateSelect('char-weapon', jpSort([...new Set(CHARACTERS.map(c => c.weapon))].filter(Boolean)));
      populateSelect('char-element', jpSort([...new Set(CHARACTERS.map(c => c.element))].filter(Boolean)));
      
      const months = [...new Set(CHARACTERS.map(c => c.birthMonth))].filter(Boolean).sort((a, b) => {
        const aNum = parseInt(a.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0))) || 99;
        const bNum = parseInt(b.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0))) || 99;
        return aNum - bNum;
      });
      populateSelect('char-birthMonth', months);
      
      const versions = [...new Set(CHARACTERS.map(c => c.releaseVersionLabel))].filter(Boolean).sort((a, b) => parseReleaseVersionNum(a) - parseReleaseVersionNum(b));
      populateSelect('char-releaseVersion', versions);
      
      populateSelect('char-rarity', [...new Set(CHARACTERS.map(c => c.rarity))].filter(v => v !== undefined).sort((a, b) => b - a).map(String));
      populateSelect('char-body', jpSort([...new Set(CHARACTERS.map(c => c.bodyLabel))].filter(Boolean)));
      populateSelect('char-role', jpSort([...new Set(CHARACTERS.flatMap(c => c.role))].filter(Boolean)));
      populateSelect('char-energy', [...new Set(CHARACTERS.map(c => c.energy))].filter(v => v !== undefined).sort((a, b) => a - b).map(String));
      populateSelect('char-talentBoss', jpSort([...new Set(CHARACTERS.map(c => c.talentBoss))].filter(Boolean)));
      populateSelect('char-localSpecialty', jpSort([...new Set(CHARACTERS.map(c => c.localSpecialty))].filter(Boolean)));
      populateSelect('char-enemyMaterial', jpSort([...new Set(CHARACTERS.map(c => c.enemyMaterial))].filter(Boolean)));
      populateSelect('char-ascensionStat', jpSort([...new Set(CHARACTERS.map(c => c.ascensionStat))].filter(Boolean)));
      populateSelect('char-talentBook', jpSort([...new Set(CHARACTERS.map(c => c.talentBook))].filter(Boolean)));
      populateSelect('char-talentWeekly', jpSort([...new Set(CHARACTERS.map(c => c.talentWeekly))].filter(Boolean)));
      populateSelect('char-specialDish', jpSort([...new Set(CHARACTERS.map(c => c.specialDish))].filter(Boolean)));

      populateSelect('w-type', jpSort([...new Set(WEAPONS.map(w => w.weaponType))].filter(Boolean)));
      populateSelect('w-rarity', [...new Set(WEAPONS.map(w => w.rarity))].filter(v => v !== undefined).sort((a, b) => b - a).map(String));
      populateSelect('w-ascensionStat', jpSort([...new Set(WEAPONS.map(w => w.ascensionStat))].filter(Boolean)));
      populateSelect('w-weaponBreakMaterial', jpSort([...new Set(WEAPONS.map(w => w.weaponBreakMaterial))].filter(Boolean)));
      populateSelect('w-enemyMaterial', jpSort([...new Set(WEAPONS.map(w => w.enemyMaterial))].filter(Boolean)));
      populateSelect('w-weaponEnemyMaterial', jpSort([...new Set(WEAPONS.map(w => w.weaponEnemyMaterial))].filter(Boolean)));
      
      const wVersions = [...new Set(WEAPONS.map(w => w.releaseVersionLabel))].filter(Boolean).sort((a, b) => parseReleaseVersionNum(a) - parseReleaseVersionNum(b));
      populateSelect('w-releaseVersion', wVersions);
    }

    function populateSelect(id, values) {
      const select = document.getElementById(id);
      if (!select) return;
      select.innerHTML = '<option value="all">すべて</option>';
      values.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v.includes('★') ? v : (id.includes('rarity') || id.includes('Rarity') ? `★${v}` : v);
        select.appendChild(opt);
      });
    }

    function bindAdvancedFilters() {
      document.getElementById('char-name-input')?.addEventListener('input', e => {
        activeFilters.charName = e.target.value.trim().toLowerCase();
        scheduleRenderGrid();
      });
      document.getElementById('w-name-input')?.addEventListener('input', e => {
        activeFilters.wName = e.target.value.trim().toLowerCase();
        scheduleRenderGrid();
      });
      document.getElementById('charQuery')?.addEventListener('input', e => {
        activeFilters.charQuery = e.target.value.trim().toLowerCase();
        scheduleRenderGrid();
      });
      document.getElementById('weaponQuery')?.addEventListener('input', e => {
        activeFilters.wQuery = e.target.value.trim().toLowerCase();
        scheduleRenderGrid();
      });

      const charFields = [
        'country', 'weapon', 'element', 'birthMonth', 'releaseVersion',
        'rarity', 'body', 'role', 'energy', 'talentBoss', 'localSpecialty',
        'enemyMaterial', 'ascensionStat', 'talentBook', 'talentWeekly',
        'specialDish', 'distributed', 'trainingRoad', 'trace', 'costume'
      ];
      charFields.forEach(field => {
        const id = 'char-' + field;
        const el = document.getElementById(id);
        el?.addEventListener('change', () => {
          activeFilters['char' + field.charAt(0).toUpperCase() + field.slice(1)] = el.value;
          renderGrid();
        });
      });

      const wFields = ['type', 'rarity', 'ascensionStat', 'weaponBreakMaterial', 'enemyMaterial', 'weaponEnemyMaterial', 'releaseVersion', 'distributed'];
      wFields.forEach(field => {
        const id = 'w-' + field;
        const el = document.getElementById(id);
        el?.addEventListener('change', () => {
          activeFilters['w' + field.charAt(0).toUpperCase() + field.slice(1)] = el.value;
          renderGrid();
        });
      });

      document.getElementById('char-reset-btn')?.addEventListener('click', () => resetAllFilters('character'));
      document.getElementById('w-reset-btn')?.addEventListener('click', () => resetAllFilters('weapon'));
    }

    function resetAllFilters(tab) {
      if (tab === 'character') {
        const charFields = [
          'country', 'weapon', 'element', 'birthMonth', 'releaseVersion',
          'rarity', 'body', 'role', 'energy', 'talentBoss', 'localSpecialty',
          'enemyMaterial', 'ascensionStat', 'talentBook', 'talentWeekly',
          'specialDish', 'distributed', 'trainingRoad', 'trace', 'costume'
        ];
        charFields.forEach(field => {
          const id = 'char-' + field;
          const el = document.getElementById(id);
          if (el) el.value = 'all';
          activeFilters['char' + field.charAt(0).toUpperCase() + field.slice(1)] = 'all';
        });
        document.getElementById('char-name-input').value = '';
        activeFilters.charName = '';
        document.getElementById('charQuery').value = '';
        activeFilters.charQuery = '';
      } else {
        const wFields = ['type', 'rarity', 'ascensionStat', 'weaponBreakMaterial', 'enemyMaterial', 'weaponEnemyMaterial', 'releaseVersion', 'distributed'];
        wFields.forEach(field => {
          const id = 'w-' + field;
          const el = document.getElementById(id);
          if (el) el.value = 'all';
          activeFilters['w' + field.charAt(0).toUpperCase() + field.slice(1)] = 'all';
        });
        document.getElementById('w-name-input').value = '';
        activeFilters.wName = '';
        document.getElementById('weaponQuery').value = '';
        activeFilters.wQuery = '';
      }
      renderGrid();
    }

    function scheduleRenderGrid() {
      if (queryDebounceTimer) clearTimeout(queryDebounceTimer);
      queryDebounceTimer = setTimeout(() => {
        queryDebounceTimer = null;
        renderGrid();
      }, QUERY_DEBOUNCE_MS);
    }

    function renderGrid() {
      const grid = document.getElementById('dbGrid');
      grid.innerHTML = '';
      let items = [];
      
      if (currentTab === 'character') {
        items = CHARACTERS.filter(c => {
          if (activeFilters.charName && !c.name.toLowerCase().includes(activeFilters.charName)) return false;
          if (activeFilters.charCountry !== 'all' && c.country !== activeFilters.charCountry) return false;
          if (activeFilters.charWeapon !== 'all' && c.weapon !== activeFilters.charWeapon) return false;
          if (activeFilters.charElement !== 'all' && c.element !== activeFilters.charElement) return false;
          if (activeFilters.charBirthMonth !== 'all' && c.birthMonth !== activeFilters.charBirthMonth) return false;
          if (activeFilters.charReleaseVersion !== 'all' && c.releaseVersionLabel !== activeFilters.charReleaseVersion) return false;
          if (activeFilters.charRarity !== 'all' && String(c.rarity) !== activeFilters.charRarity) return false;
          if (activeFilters.charBody !== 'all' && c.bodyLabel !== activeFilters.charBody) return false;
          if (activeFilters.charRole !== 'all' && !c.role.includes(activeFilters.charRole)) return false;
          if (activeFilters.charEnergy !== 'all' && String(c.energy) !== activeFilters.charEnergy) return false;
          if (activeFilters.charTalentBoss !== 'all' && c.talentBoss !== activeFilters.charTalentBoss) return false;
          if (activeFilters.charLocalSpecialty !== 'all' && c.localSpecialty !== activeFilters.charLocalSpecialty) return false;
          if (activeFilters.charEnemyMaterial !== 'all' && c.enemyMaterial !== activeFilters.charEnemyMaterial) return false;
          if (activeFilters.charAscensionStat !== 'all' && c.ascensionStat !== activeFilters.charAscensionStat) return false;
          if (activeFilters.charTalentBook !== 'all' && c.talentBook !== activeFilters.charTalentBook) return false;
          if (activeFilters.charTalentWeekly !== 'all' && c.talentWeekly !== activeFilters.charTalentWeekly) return false;
          if (activeFilters.charSpecialDish !== 'all' && c.specialDish !== activeFilters.charSpecialDish) return false;
          if (activeFilters.charDistributed !== 'all' && String(c.distributed) !== activeFilters.charDistributed) return false;
          if (activeFilters.charTrainingRoad !== 'all' && String(c.trainingRoad) !== activeFilters.charTrainingRoad) return false;
          if (activeFilters.charTrace !== 'all' && String(c.trace) !== activeFilters.charTrace) return false;
          if (activeFilters.charCostume !== 'all' && String(c.costume) !== activeFilters.charCostume) return false;
          if (!matchesAllFields(c, activeFilters.charQuery)) return false;
          return true;
        });
      } else {
        items = WEAPONS.filter(w => {
          if (activeFilters.wName && !w.name.toLowerCase().includes(activeFilters.wName)) return false;
          if (activeFilters.wType !== 'all' && w.weaponType !== activeFilters.wType) return false;
          if (activeFilters.wRarity !== 'all' && String(w.rarity) !== activeFilters.wRarity) return false;
          if (activeFilters.wAscensionStat !== 'all' && w.ascensionStat !== activeFilters.wAscensionStat) return false;
          if (activeFilters.wWeaponBreakMaterial !== 'all' && w.weaponBreakMaterial !== activeFilters.wWeaponBreakMaterial) return false;
          if (activeFilters.wEnemyMaterial !== 'all' && w.enemyMaterial !== activeFilters.wEnemyMaterial) return false;
          if (activeFilters.wWeaponEnemyMaterial !== 'all' && w.weaponEnemyMaterial !== activeFilters.wWeaponEnemyMaterial) return false;
          if (activeFilters.wReleaseVersion !== 'all' && w.releaseVersionLabel !== activeFilters.wReleaseVersion) return false;
          if (activeFilters.wDistributed !== 'all' && String(w.isDistributed) !== activeFilters.wDistributed) return false;
          if (!matchesAllFields(w, activeFilters.wQuery)) return false;
          return true;
        });
      }

      if (items.length === 0) {
        grid.innerHTML = '<p class="empty-msg">該当するデータがありません。</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'db-card rarity-' + item.rarity;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'card-thumb-wrap';
        thumbWrap.appendChild(buildImageNode(item, 'card-thumb'));

        const name = document.createElement('div');
        name.className = 'card-name';
        name.textContent = item.name;

        card.appendChild(thumbWrap);
        card.appendChild(name);
        card.addEventListener('click', () => showDetail(item, card));
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            showDetail(item, card);
          }
        });
        grid.appendChild(card);
      });
    }

    function showDetail(item, selectedCard) {
      currentEditingItem = item;
      document.querySelectorAll('.db-card').forEach(card => card.classList.toggle('active', card === selectedCard));
      document.getElementById('detailTitle').textContent = item.name + ' の詳細';
      const detailGrid = document.getElementById('detailGrid');
      const detailSummary = document.getElementById('detailSummary');
      const detailImageWrap = document.getElementById('detailImageWrap');
      detailGrid.innerHTML = '';
      detailSummary.innerHTML = '';
      detailImageWrap.innerHTML = '';
      detailImageWrap.appendChild(buildImageNode(item, 'db-modal-image'));

      const saveBtnRow = document.querySelector('.db-save-row');
      if (saveBtnRow) saveBtnRow.style.display = isAdminMode ? 'flex' : 'none';

      const basicFields = [
        ['name', '名前', item.name],
        ['rarity', 'レアリティ', item.rarity],
        [currentTab === 'character' ? 'element' : 'weaponType', currentTab === 'character' ? '元素' : '武器種', currentTab === 'character' ? item.element : item.weaponType]
      ];

      basicFields.forEach(([key, label, val]) => {
        const line = document.createElement('p');
        if (isAdminMode) {
          line.innerHTML = `<b>${label}:</b> <input type="text" class="db-edit-input" data-key="${key}" value="${val !== undefined ? val : ''}" style="display:inline-block; width:auto; margin-left:6px;">`;
        } else {
          line.textContent = `${label}: ${key === 'rarity' ? '★' + val : val}`;
        }
        detailSummary.appendChild(line);
      });

      const entries = getDetailEntries(item);
      entries.forEach(([key, label, value]) => {
        if (!key) return;
        const box = document.createElement('div');
        box.className = 'db-detail-item';
        
        if (isAdminMode) {
          let inputHtml = '';
          if (typeof value === 'boolean' || ['distributed', 'costume', 'trace', 'trainingRoad', 'isDistributed'].includes(key)) {
            const boolVal = Boolean(value);
            inputHtml = `
              <select class="db-edit-select" data-key="${key}">
                <option value="true" ${boolVal ? 'selected' : ''}>あり / はい</option>
                <option value="false" ${!boolVal ? 'selected' : ''}>なし / いいえ</option>
              </select>`;
          } else {
            inputHtml = `<input type="text" class="db-edit-input" data-key="${key}" value="${value !== undefined && value !== null ? value : ''}">`;
          }
          box.innerHTML = `<b>${label}</b>${inputHtml}`;
        } else {
          let displayVal = value;
          if (typeof value === 'boolean') displayVal = value ? 'あり' : 'なし';
          if (Array.isArray(value)) displayVal = value.filter(Boolean).join(' / ');
          box.innerHTML = `<b>${label}</b><span>${displayVal !== undefined && displayVal !== null && displayVal !== '' ? displayVal : '—'}</span>`;
        }
        detailGrid.appendChild(box);
      });

      openDetailModal();
    }

    function getDetailEntries(item) {
      if (currentTab === 'character') {
        return [
          ['country', '所属', item.country],
          ['birthday', '誕生日', item.birthday],
          ['bodyLabel', '体型', item.bodyLabel],
          ['baseAtk', '基礎攻撃力', item.baseAtkLabel || item.baseAtk],
          ['baseHp', '基礎HP', item.baseHpLabel || item.baseHp],
          ['baseDef', '基礎防御力', item.baseDefLabel || item.baseDef],
          ['role', '役割', (item.role || []).filter(Boolean).join(' / ')],
          ['energy', '元素エネルギー', item.energy],
          ['ascensionStat', '突破ステータス', item.ascensionStat],
          ['localSpecialty', '特産品', item.localSpecialty],
          ['talentBoss', '突破ボス素材', item.talentBoss],
          ['talentBook', '天賦本', item.talentBook],
          ['talentWeekly', '週ボス素材', item.talentWeekly],
          ['enemyMaterial', '敵素材', item.enemyMaterial],
          ['specialDish', 'オリジナル料理', item.specialDish],
          ['distributed', '配布キャラ', item.distributed],
          ['costume', '衣装', item.costume],
          ['trace', '軌跡の有無', item.trace],
          ['trainingRoad', '鍛錬の道', item.trainingRoad],
          ['releaseVersionLabel', '実装バージョン', item.releaseVersionLabel],
        ];
      }

      return [
        ['weaponType', '武器種', item.weaponType],
        ['baseAtk', '基礎攻撃力', item.baseAtk],
        ['ascensionStat', '突破ステータス', item.ascensionStat],
        ['isDistributed', '配布武器', item.isDistributed],
        ['weaponBreakMaterial', '武器突破素材', item.weaponBreakMaterial],
        ['enemyMaterial', '敵素材', item.enemyMaterial],
        ['weaponEnemyMaterial', '精鋭素材', item.weaponEnemyMaterial],
        ['releaseVersionLabel', '実装バージョン', item.releaseVersionLabel],
      ];
    }

    function matchesAllFields(item, query) {
      if (!query) return true;
      const values = Object.values(item);
      for (const value of values) {
        if (value === null || value === undefined) continue;
        if (Array.isArray(value)) {
          for (const part of value) {
            if (part === null || part === undefined) continue;
            if (String(part).toLowerCase().includes(query)) return true;
          }
          continue;
        }
        if (typeof value === 'boolean') {
          if ((value ? 'あり' : 'なし').includes(query)) return true;
          if ((value ? 'true' : 'false').includes(query)) return true;
          continue;
        }
        if (String(value).toLowerCase().includes(query)) return true;
      }
      return false;
    }

    function bindDetailModal() {
      document.getElementById('detailClose').addEventListener('click', closeDetailModal);
      document.getElementById('detailOverlay').addEventListener('click', closeDetailModal);
      
      document.getElementById('detailEditForm')?.addEventListener('submit', async e => {
        e.preventDefault();
        if (!currentEditingItem) return;
        if (!githubToken) {
          alert('GitHub Tokenが設定されていません。管理者に再認証してください。');
          return;
        }

        const inputs = document.querySelectorAll('.db-edit-input, .db-edit-select');
        const updates = {};

        inputs.forEach(el => {
          const key = el.dataset.key;
          if (!key) return;
          let val = el.value;
          if (val === 'true') val = true;
          else if (val === 'false') val = false;
          else if (!isNaN(val) && val !== '' && key === 'rarity') val = Number(val);
          updates[key] = val;
        });

        Object.assign(currentEditingItem, updates);

        try {
          const submitBtn = document.querySelector('.db-save-btn');
          submitBtn.disabled = true;
          submitBtn.textContent = 'GitHubにコミット中...';

          const fileRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_FILE_PATH}`, {
            headers: { 'Authorization': `bearer ${githubToken}` }
          });
          if (!fileRes.ok) throw new Error('GitHubファイルの取得に失敗しました。トークン権限をご確認ください。');
          const fileData = await fileRes.json();
          const sha = fileData.sha;

          const fileContentStr = `const CHARACTERS = ${JSON.stringify(CHARACTERS, null, 2)};\n\nconst WEAPONS = ${JSON.stringify(WEAPONS, null, 2)};`;
          const base64Content = btoa(unescape(encodeURIComponent(fileContentStr)));

          const putRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_FILE_PATH}`, {
            method: 'PUT',
            headers: {
              'Authorization': `bearer ${githubToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Update ${currentEditingItem.name} via Admin Panel`,
              content: base64Content,
              sha: sha
            })
          });

          if (putRes.ok) {
            alert('GitHubリポジトリへ正常にコミットされました！数分後に全ユーザーへ反映されます。');
            closeDetailModal();
            renderGrid();
          } else {
            const errJson = await putRes.json();
            alert('コミットに失敗しました: ' + (errJson.message || 'エラーが発生しました'));
          }
        } catch (err) {
          alert('エラーが発生しました: ' + err.message);
        } finally {
          const submitBtn = document.querySelector('.db-save-btn');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'GitHubへコミット（全ユーザーに反映）';
          }
        }
      });
    }

    function openDetailModal() {
      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailOverlay').classList.remove('hidden');
      document.getElementById('detailOverlay').setAttribute('aria-hidden', 'false');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailOverlay').classList.add('hidden');
      document.getElementById('detailOverlay').setAttribute('aria-hidden', 'true');
      currentEditingItem = null;
    }

    function buildImageNode(item, className) {
      const wrap = document.createElement('div');
      wrap.className = className === 'card-thumb' ? 'card-thumb-fallback' : 'db-modal-fallback';
      wrap.textContent = currentTab === 'character' ? '👤' : '⚔';

      if (!item.iconUrl) return wrap;

      const image = document.createElement('img');
      image.className = className;
      image.src = item.iconUrl;
      image.alt = item.name;
      image.addEventListener('error', () => image.replaceWith(wrap), { once: true });
      return image;
    }

    let adminClickCount = 0;
    let adminClickTimer = null;
    const ADMIN_CLICK_THRESHOLD = 10;
    const ADMIN_CLICK_WINDOW = 10000;

    function bindAdminAuthTrigger() {
      const trigger = document.getElementById('dbAdminTrigger');
      if (trigger) {
        trigger.addEventListener('click', () => {
          adminClickCount++;
          if (adminClickTimer) clearTimeout(adminClickTimer);
          adminClickTimer = setTimeout(() => { adminClickCount = 0; }, ADMIN_CLICK_WINDOW);
          if (adminClickCount >= ADMIN_CLICK_THRESHOLD) {
            adminClickCount = 0;
            clearTimeout(adminClickTimer);
            openAdminAuth();
          }
        });
      }

      document.getElementById('adminAuthClose')?.addEventListener('click', closeAdminAuthModal);
      document.getElementById('adminAuthOverlay')?.addEventListener('click', closeAdminAuthModal);
      document.getElementById('adminAuthBtn')?.addEventListener('click', handleAdminAuth);
      document.getElementById('adminPasswordInput')?.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleAdminAuth();
      });
    }

    function openAdminAuth() {
      const input = document.getElementById('adminPasswordInput');
      if (input) input.value = '';
      const tokenInput = document.getElementById('githubTokenInput');
      if (tokenInput) tokenInput.value = githubToken;
      document.getElementById('adminAuthError')?.classList.add('hidden');
      document.getElementById('adminAuthModal')?.classList.remove('hidden');
      document.getElementById('adminAuthOverlay')?.classList.remove('hidden');
      setTimeout(() => input?.focus(), 100);
    }

    function closeAdminAuthModal() {
      document.getElementById('adminAuthModal')?.classList.add('hidden');
      document.getElementById('adminAuthOverlay')?.classList.add('hidden');
    }

    function handleAdminAuth() {
      const input = document.getElementById('adminPasswordInput');
      const tokenInput = document.getElementById('githubTokenInput');
      if (!input) return;

      if (input.value === 'Liliavanrouge0101') {
        if (tokenInput && tokenInput.value.trim()) {
          githubToken = tokenInput.value.trim();
          localStorage.setItem('github_pat', githubToken);
        }
        isAdminMode = true;
        closeAdminAuthModal();
        alert('管理者モードが有効化されました。詳細画面から編集して「GitHubへコミット」を行うと全ユーザーに反映されます。');
      } else {
        document.getElementById('adminAuthError')?.classList.remove('hidden');
      }
    }
  </script>
</body>
