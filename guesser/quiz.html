<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原神 Guesser — クイズモード</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="quiz.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">❓ 原神クイズ</h1>
    <nav class="header-actions">
      <button class="icon-btn" id="varietyAdminTrigger" type="button" title="バラエティクイズ管理">🔐</button>
      <a href="../index.html" class="back-link icon-btn">← メニュー</a>
    </nav>
  </header>

  <main class="app-main" role="main">

    <!-- ① 設定・開始画面 -->
    <section class="quiz-setup-card" id="quizSetupCard">
      <h2 class="quiz-section-title">クイズ設定</h2>

      <div class="quiz-option-group">
        <span class="quiz-option-label">クイズの種類</span>
        <div class="quiz-pill-row" id="quizKindGroup">
          <button type="button" class="quiz-pill-btn active" data-kind="data">🔍 データクイズ</button>
          <button type="button" class="quiz-pill-btn" data-kind="variety">🎵 バラエティクイズ</button>
        </div>
      </div>

      <div class="quiz-option-group" id="quizGenreGroup">
        <span class="quiz-option-label">出題ジャンル（データクイズ）</span>
        <div class="quiz-pill-row">
          <button type="button" class="quiz-pill-btn active" data-qgenre="mix">✨ ミックス</button>
          <button type="button" class="quiz-pill-btn" data-qgenre="character">👤 キャラクター</button>
          <button type="button" class="quiz-pill-btn" data-qgenre="weapon">⚔ 武器</button>
        </div>
      </div>

      <div class="quiz-option-group" id="quizDiffGroup">
        <span class="quiz-option-label">難易度（解答形式）</span>
        <div class="quiz-pill-row">
          <button type="button" class="quiz-pill-btn active" data-diff="easy">🟢 イージー</button>
          <button type="button" class="quiz-pill-btn" data-diff="normal">🟡 ノーマル</button>
          <button type="button" class="quiz-pill-btn" data-diff="hard">🔴 ハード</button>
        </div>
      </div>

      <div class="quiz-option-group" id="quizRuleGroup">
        <span class="quiz-option-label">ルール</span>
        <div class="quiz-pill-row">
          <button type="button" class="quiz-pill-btn active" data-rule="ten">🔟 10問</button>
          <button type="button" class="quiz-pill-btn" data-rule="endless">🔁 エンドレス</button>
          <button type="button" class="quiz-pill-btn" data-rule="challenge">🏆 チャレンジ（3ミス終了）</button>
        </div>
      </div>

      <button type="button" class="quiz-start-btn" id="quizStartBtn">🎮 クイズを始める</button>
    </section>

    <!-- ② プレイ画面 -->
    <section class="quiz-play-card hidden" id="quizPlayCard">
      <div class="quiz-hud">
        <span class="quiz-badge" id="hudModeBadge">データクイズ / イージー</span>
        <span id="hudProgress">第 1 問</span>
        <span id="hudScore">正解: 0</span>
        <span class="quiz-lives hidden" id="hudLives">❤️❤️❤️</span>
      </div>

      <div class="quiz-question-box">
        <div class="quiz-icons-row hidden" id="quizIconsRow"></div>
        <p class="quiz-question-text" id="quizQuestionText">読み込み中…</p>
        <div class="quiz-text-choices hidden" id="quizTextChoices"></div>
      </div>

      <!-- イージー：4択 -->
      <div class="quiz-choices-grid hidden" id="quizChoicesGrid"></div>

      <!-- ノーマル／ハード：入力 -->
      <div class="quiz-input-wrap hidden" id="quizInputWrap">
        <div class="quiz-input-row">
          <input type="text" id="quizAnswerInput" class="quiz-text-input" placeholder="答えを入力…" autocomplete="off">
          <button type="button" class="submit-btn" id="quizAnswerSubmit">回答</button>
        </div>
        <div class="quiz-suggest-list hidden" id="quizSuggestList"></div>
        <p class="quiz-input-hint" id="quizInputHint"></p>
      </div>

      <!-- フィードバック -->
      <div class="quiz-feedback hidden" id="quizFeedback"></div>

      <div class="quiz-next-row">
        <button type="button" class="submit-btn hidden" id="quizNextBtn" style="flex:1;">次の問題へ →</button>
        <button type="button" class="icon-btn" id="quizQuitBtn">やめる</button>
      </div>
    </section>

    <!-- ③ 結果画面 -->
    <section class="quiz-result-card hidden" id="quizResultCard">
      <h2 class="quiz-section-title" style="text-align:center;" id="quizResultTitle">結果発表</h2>
      <div class="quiz-final-score" id="quizFinalScore">0 / 10</div>
      <p style="text-align:center; font-size:.88rem; color:#ccc;" id="quizResultSub"></p>

      <div class="quiz-history-list" id="quizHistoryList"></div>

      <div class="action-row">
        <button type="button" class="icon-btn share-btn" id="quizShareBtn">Twitterで共有</button>
        <button type="button" class="icon-btn copy-btn" id="quizCopyBtn">📋 結果をコピー</button>
        <button type="button" class="submit-btn" id="quizRetryBtn">もう一回遊ぶ</button>
        <button type="button" class="icon-btn" id="quizBackSetupBtn">設定に戻る</button>
      </div>
    </section>

  </main>

  <!-- バラエティクイズ：管理者認証モーダル -->
  <div class="overlay hidden" id="vAuthOverlay"></div>
  <div class="modal hidden" id="vAuthModal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 class="modal-title">🔐 バラエティクイズ管理者認証</h2>
      <button class="modal-close" id="vAuthClose">✕</button>
    </div>
    <div class="variety-form-grid">
      <label>管理者パスワード
        <input type="password" id="vAdminPassInput" class="variety-form-input" placeholder="パスワードを入力">
      </label>
      <p class="input-error hidden" id="vAuthError">パスワードが違います</p>
      <button type="button" class="submit-btn" id="vAuthSubmit">認証</button>
    </div>
  </div>

  <!-- バラエティクイズ：問題管理モーダル -->
  <div class="overlay hidden" id="vManageOverlay"></div>
  <div class="modal variety-admin-modal hidden" id="vManageModal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 class="modal-title">🎵 バラエティクイズ管理</h2>
      <button class="modal-close" id="vManageClose">✕</button>
    </div>

    <div class="variety-form-grid">
      <input type="hidden" id="vEditIndex">
      <label>問題文
        <textarea id="vQuestionInput" class="variety-form-textarea" rows="2" placeholder="例：モンドの酒場「エンジェルズシェア」のオーナーは？"></textarea>
      </label>
      <label>正解（正式名称）
        <input type="text" id="vAnswerInput" class="variety-form-input" placeholder="例：ディルック">
      </label>
      <label>ハードモードで追加許容する表記（カンマ区切り・任意）
        <input type="text" id="vAcceptInput" class="variety-form-input" placeholder="例：でぃるっく, 旦那">
      </label>
      <label>イージー用ダミー選択肢（3つ）
        <div class="variety-dummy-grid">
          <input type="text" id="vDummy1" class="variety-form-input" placeholder="ダミー1">
          <input type="text" id="vDummy2" class="variety-form-input" placeholder="ダミー2">
          <input type="text" id="vDummy3" class="variety-form-input" placeholder="ダミー3">
        </div>
      </label>
      <label>解説（任意）
        <input type="text" id="vExplanationInput" class="variety-form-input" placeholder="解答後に表示される補足">
      </label>

      <div style="display:flex; gap:.5rem; margin-top:.3rem;">
        <button type="button" class="submit-btn" id="vSaveBtn" style="flex:1;">追加してGitHubへ保存</button>
        <button type="button" class="icon-btn hidden" id="vCancelEditBtn">編集をやめる</button>
      </div>
    </div>

    <hr style="border-color:var(--border); margin:.8rem 0;">
    <h3 style="font-size:.9rem; color:var(--accent);">登録済みの問題一覧（<span id="vCountLabel">0</span>問）</h3>
    <div class="variety-list" id="vAdminList"></div>
  </div>

  <script src="data.js"></script>
  <script src="quiz-engine.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
